<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>變更密碼 - ee-class</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <header class="auth-header">國立中央大學「新 ee-class 系統」</header>

  <main class="auth-main">
    <div class="auth-card panel-box">
      <h1 class="auth-title">請變更密碼</h1>
      <p class="auth-hint" style="text-align:center;">
        首次登入或帳號安全政策要求，請先設定您的新密碼後再使用系統。
      </p>
      <form id="changeForm" style="display:flex;flex-direction:column;gap:16px;">
        <input id="password" type="password" class="input-box" placeholder="新密碼（至少 8 字元）" required minlength="8" />
        <input id="confirmPassword" type="password" class="input-box" placeholder="確認新密碼" required />
        <button type="submit" class="btn btn-primary" id="submitBtn">確認變更</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!getToken()) {
      window.location.href = "login.html";
    }

    document.getElementById("changeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (password !== confirmPassword) {
        alert("兩次輸入的密碼不相符");
        return;
      }
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "儲存中…";
      try {
        const data = await api.post("/api/auth/change-password", { password, confirmPassword });
        setMustChangePassword(false);
        alert(data.message || "密碼已更新");
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(err.data?.message || err.message || "變更失敗");
      } finally {
        btn.disabled = false;
        btn.textContent = "確認變更";
      }
    });
  </script>
</body>
</html>
