<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼 - ee-class</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <header class="auth-header">國立中央大學「新 ee-class 系統」</header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">忘記密碼</h1>
      <p class="auth-hint">
        請輸入<strong>帳號</strong>與教師提供的<strong>重設密碼代碼</strong>，並設定新密碼。
      </p>
      <form id="forgotForm" style="display:flex;flex-direction:column;gap:16px;">
        <input id="username" type="text" class="input-underline" placeholder="帳號" required />
        <input id="recoveryCode" type="password" class="input-underline" placeholder="重設密碼代碼" required />
        <input id="password" type="password" class="input-underline" placeholder="新密碼（至少 8 字元）" required minlength="8" />
        <input id="confirmPassword" type="password" class="input-underline" placeholder="確認新密碼" required />
        <button type="submit" class="btn btn-primary" id="submitBtn">重設密碼</button>
      </form>
      <p class="auth-links-inline" style="margin-top:24px;">
        <a href="login.html">返回登入</a>
      </p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
