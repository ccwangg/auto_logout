<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 - ee-class</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <header class="auth-header">國立中央大學「新 ee-class 系統」</header>

  <main class="auth-main">
    <div class="auth-card">
      <form id="loginForm" class="flex flex-col" style="display:flex;flex-direction:column;gap:24px;">
        <div>
          <input id="username" type="text" class="input-underline" placeholder="帳號" required autocomplete="username" />
        </div>
        <div class="input-wrap">
          <input id="password" type="password" class="input-underline" placeholder="Password" required autocomplete="current-password" style="padding-right:48px;" />
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="顯示密碼">👁</button>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">保持登入狀態</label>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">登入</button>
      </form>

      <div class="auth-links">
        <a href="forgot-password.html">忘記密碼</a>
        <a href="register.html">註冊</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
